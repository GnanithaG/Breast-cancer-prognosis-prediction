[project]
name = "breast-cancer-survival"
version = "1.0.0"
description = "Survival modelling (Cox, Random Survival Forest, gradient boosting) on the SEER breast cancer extract"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]  # line length is handled by `ruff format`
